{# A drawn notebook page. Everything except the ink shows planned behaviour, and is captioned as such where used. #}
<svg class="page-art" viewBox="0 0 520 360" role="img" aria-label="A notebook page with handwritten working: three quarters of 28, 28 divided by 4 equals 7, 7 times 3 equals 21.">
  <rect width="520" height="360" rx="10" fill="#fffefb"/>
  <g stroke="#dfe5f5" stroke-width="1.5">
    <path d="M0 60h520M0 110h520M0 160h520M0 210h520M0 260h520M0 310h520"/>
  </g>
  <path d="M58 0v360" stroke="#f3c4bd" stroke-width="1.5"/>
  <g font-family="Caveat, 'Segoe Print', cursive" font-weight="600" fill="#1b2559">
    <text x="78" y="50" font-size="38">Find ¾ of 28</text>
    <text x="78" y="150" font-size="44">28 ÷ 4 = 7</text>
    <text x="78" y="250" font-size="44">7 × 3 = 21</text>
  </g>
  <g class="art-ask">
    <circle cx="236" cy="136" r="25" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 5"/>
    <text x="270" y="145" font-family="Caveat, 'Segoe Print', cursive" font-size="29" font-weight="600" fill="#b45309">1 or 7?</text>
  </g>
  <g class="art-check" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 134l10 11 19-23"/>
    <path d="M262 234l10 11 19-23"/>
  </g>
  <g class="art-review">
    <rect x="340" y="284" width="156" height="44" rx="8" fill="#ede9fe"/>
    <text x="418" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#4c3fd1">Parent reviewed</text>
  </g>
</svg>
