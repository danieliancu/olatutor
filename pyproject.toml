[project]
name = "tutor"
version = "0.1.0"
description = "Parent-managed intelligent digital notebook."
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2.18,<5.3",
    "psycopg[binary]>=3.3,<4",
    "pillow>=12",
    "jsonschema>=4.26,<5",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.14,<5",
    "hypothesis>=6.170,<7",
    "ruff>=0.17,<0.18",
    "mypy>=1.19",
    "django-stubs>=5.2,<5.3",
    "types-jsonschema",
    "types-pyyaml",
]
e2e = [
    "pytest-playwright>=0.10,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --ignore=tests/e2e"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "C4", "SIM"]
ignore = ["S101", "DJ008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/generate_ink_fixtures.py" = ["S311"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
exclude = ["migrations/", "tests/e2e/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
