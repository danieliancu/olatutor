name: tutor

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?copy .env.example to .env}
  DJANGO_EXTRA_ALLOWED_HOSTS: ${DJANGO_EXTRA_ALLOWED_HOSTS:-}
  DATABASE_HOST: db
  DATABASE_NAME: tutor
  DATABASE_USER: tutor
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tutor
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    environment: *app-env
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Shared-fixture conformance of the JS core. No npm dependencies.
  js:
    profiles: ["js"]
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    command: ["node", "--test", "tests/js/*.test.mjs"]

  # Browser end-to-end tests with simulated pointer input.
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: e2e
    volumes:
      - .:/app
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_ALLOW_ASYNC_UNSAFE: "true"
    depends_on:
      db:
        condition: service_healthy
    command: pytest tests/e2e -o addopts= --browser chromium --browser firefox --browser webkit -ra -p no:cacheprovider

volumes:
  pgdata:
